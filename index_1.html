<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Dashboard</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--text:#16181d;--muted:#6b7280;--line:#e5e7eb;
  --accent:#3b6fd8;--warn:#b7791f;--warn-bg:#fdf3dc;--ok:#23804a;--ok-bg:#e3f4ea;--chip:#eef1f6;
  --late:#c0362c;--late-bg:#fde7e5;--today:#c25e00;--today-bg:#ffeedd;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--panel:#171a21;--text:#e7e9ee;--muted:#9aa1ad;--line:#262a33;
  --accent:#7aa2ff;--warn:#f0b84a;--warn-bg:#3a2e14;--ok:#5fcf8c;--ok-bg:#15301f;--chip:#222631;
  --late:#ff8a80;--late-bg:#3d1a18;--today:#ffb066;--today-bg:#3b2512;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:18px}
h1{font-size:22px;margin:0}
.updated{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px}
.stat.warn .v{color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:10px}
.tabs button{white-space:nowrap;border:0;background:none;color:var(--muted);padding:7px 12px;border-radius:7px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs .n{font-size:12px;opacity:.7;margin-left:4px}
input[type=search]{flex:1;min-width:160px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);font:inherit}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:9px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--panel)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sku{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-weight:650;font-variant-numeric:tabular-nums}
.pill.buy{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.ship{display:inline-block;padding:2px 8px;border-radius:99px;font-size:13px;white-space:nowrap;background:var(--chip);color:var(--muted)}
.ship.late{background:var(--late-bg);color:var(--late);font-weight:650}
.ship.today{background:var(--today-bg);color:var(--today);font-weight:650}
.ship.soon{background:var(--warn-bg);color:var(--warn);font-weight:600}
.stat.late .v{color:var(--late)}
.stat.today .v{color:var(--today)}
.stat .v.small{font-size:20px;line-height:1.55}
a{color:var(--accent);white-space:nowrap}
.empty{padding:32px;text-align:center;color:var(--muted)}
.prod{max-width:520px}
.hdr-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a.btn{text-decoration:none;font-size:14px;padding:7px 12px}
.hidden{display:none!important}
.spend{padding:16px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.person h3{margin:0 0 8px;font-size:16px}
.person .big{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
.person .kv{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:4px}
.person .kv b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.settle{margin:14px 0;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:600}
.settle.even{background:var(--ok-bg);color:var(--ok)}
.spend h4{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.spend table td,.spend table th{padding:8px 6px}
@media (max-width:700px){
  .tabs{width:100%;flex-wrap:wrap}.tabs button{flex:1 1 40%;padding:7px 6px}
  .spend td{display:inline-block;width:auto;margin-right:12px}
  .spend td[data-l]::before{content:none}
  .spend td:nth-child(2){font-weight:600}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{padding:10px 14px;border-bottom:1px solid var(--line)}
  td{border:0;padding:2px 0;text-align:left!important}
  td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Stock Dashboard</h1>
    <div class="hdr-r">
      <span class="updated" id="updated">Loading…</span>
      <a class="btn hidden" id="uploadBtn" target="_blank" rel="noopener">📷 Upload receipt</a>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <div class="bar">
    <div class="tabs" id="tabs">
      <button data-t="need" class="on">Need to buy<span class="n" id="n-need"></span></button>
      <button data-t="inventory">Inventory<span class="n" id="n-inventory"></span></button>
      <button data-t="orders">Open orders<span class="n" id="n-orders"></span></button>
      <button data-t="spend" class="hidden" id="spendTab">Spend</button>
    </div>
    <input type="search" id="q" placeholder="Filter by name or SKU">
    <button class="btn" id="copy" title="Copy the buy list as text">Copy buy list</button>
  </div>

  <div class="card" id="view"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => v == null || v === "" ? "—" : "$" + Number(v).toFixed(2);
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
let data = null, tab = "need";
try { tab = localStorage.getItem("tab") || "need"; } catch {}

// Data source. GitHub Pages can take minutes (or get stuck in a queue) to republish after each
// commit, so we also read data.json straight from the repo via raw.githubusercontent.com, which
// updates within seconds, and show whichever copy is newest.
function rawCandidates() {
  const m = /^([^.]+)\.github\.io$/i.exec(location.hostname);
  if (!m) return [];
  const owner = m[1];
  const parts = location.pathname.split("/").filter(Boolean);
  const repo = parts.length ? parts[0] : `${owner}.github.io`;
  const base = `https://raw.githubusercontent.com/${owner}/${repo}/main/`;
  return [base + "data.json", base + "docs/data.json"];
}
async function getJson(url) {
  const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function load() {
  const sources = ["data.json", ...rawCandidates()];
  const results = await Promise.allSettled(sources.map(getJson));
  const ok = results.filter(r => r.status === "fulfilled" && r.value && r.value.updated).map(r => r.value);
  if (!ok.length) { if (!data) $("#updated").textContent = "Couldn't load data.json"; return; }
  ok.sort((a, b) => new Date(b.updated) - new Date(a.updated));
  data = ok[0];
  render();
}

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return new Date(iso).toLocaleString();
}

// Ship-by helpers. Dates arrive as "YYYY-MM-DD" or "YYYY-MM-DD HH:MM".
function shipInfo(v) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v || "");
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const days = Math.round((d - t) / 86400000);
  const pretty = d.toLocaleDateString(undefined, {month: "short", day: "numeric"});
  if (days < 0) return {cls: "late", text: `Overdue · ${pretty}`, days};
  if (days === 0) return {cls: "today", text: "Today", days};
  if (days === 1) return {cls: "soon", text: "Tomorrow", days};
  return {cls: days <= 3 ? "soon" : "", text: `${pretty} · ${days}d`, days};
}
const shipChip = v => { const i = shipInfo(v); return i ? `<span class="ship ${i.cls}">${esc(i.text)}</span>` : `<span class="sku">—</span>`; };
function shortDate(v) {
  const m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/.exec(v || "");
  if (!m) return esc(v || "—");
  const d = new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0));
  return esc(d.toLocaleDateString(undefined, {month: "short", day: "numeric"}));
}

function render() {
  const need = data.need || [], inv = data.inventory || [], orders = data.open_orders || [];
  const buy = need.filter(r => r.to_buy > 0);
  const units = buy.reduce((a, r) => a + r.to_buy, 0);
  const cost = buy.reduce((a, r) => a + (r.est_cost || 0), 0);
  const missingCost = buy.some(r => r.est_cost == null);
  $("#updated").textContent = "Updated " + ago(data.updated);
  const soonest = orders.map(o => o.ship_by).filter(v => shipInfo(v)).sort()[0];
  const si = shipInfo(soonest);
  const dueSoon = orders.filter(o => { const i = shipInfo(o.ship_by); return i && i.days <= 1; }).length;
  $("#stats").innerHTML = [
    [units, "units to buy", units > 0 ? "warn" : ""],
    [si ? si.text : "—", si ? `next ship-by${dueSoon ? ` · ${dueSoon} order${dueSoon === 1 ? "" : "s"} due ≤ tomorrow` : ""}` : "next ship-by",
     si ? (si.cls === "late" ? "late" : si.cls === "today" ? "today" : si.cls === "soon" ? "warn" : "") : "", true],
    [cost ? money(cost) + (missingCost ? "+" : "") : "—", "est. cost", ""],
    [orders.length, "open orders", ""],
  ].map(([v, l, c, small]) => `<div class="stat ${c}"><div class="v${small ? " small" : ""}">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join("");
  $("#n-need").textContent = buy.length;
  $("#n-inventory").textContent = inv.length;
  $("#n-orders").textContent = orders.length;
  const sp = data.spend;
  $("#spendTab").classList.toggle("hidden", !sp);
  if (data.receipt_url && /^https:\/\//.test(data.receipt_url)) { $("#uploadBtn").href = data.receipt_url; $("#uploadBtn").classList.remove("hidden"); }
  else $("#uploadBtn").classList.add("hidden");
  if (tab === "spend" && !sp) tab = "need";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));

  const q = $("#q").value.trim().toLowerCase();
  const match = r => !q || (r.product || "").toLowerCase().includes(q) || (r.sku || "").toLowerCase().includes(q);
  const prod = r => `<div class="prod">${esc(r.product || "(no name)")}</div><div class="sku">${esc(r.sku)}</div>`;
  let head, rows;

  if (tab === "need") {
    head = `<th>Product</th><th class="num">To buy</th><th>Ship by</th><th class="num">Orders</th><th class="num">Units needed</th><th class="num">On hand</th><th class="num">Est. cost</th><th></th>`;
    rows = need.filter(match).map(r => `<tr>
      <td>${prod(r)}</td>
      <td class="num" data-l="To buy"><span class="pill ${r.to_buy ? "buy" : "ok"}">${r.to_buy ? r.to_buy : "✓ covered"}</span></td>
      <td data-l="Ship by">${shipChip(r.ship_by)}</td>
      <td class="num" data-l="Orders">${r.open_orders}</td>
      <td class="num" data-l="Units needed">${r.units_needed}</td>
      <td class="num" data-l="On hand">${r.on_hand}</td>
      <td class="num" data-l="Est. cost">${money(r.est_cost)}</td>
      <td>${safeUrl(r.buy_link) ? `<a href="${esc(r.buy_link)}" target="_blank" rel="noopener">Buy ↗</a>` : ""}</td></tr>`);
  } else if (tab === "inventory") {
    head = `<th>Product</th><th class="num">On hand</th><th class="num">Per order</th><th class="num">Unit cost</th><th></th>`;
    rows = inv.filter(match).map(r => `<tr>
      <td>${prod(r)}</td>
      <td class="num" data-l="On hand">${r.on_hand}</td>
      <td class="num" data-l="Per order">${r.units_per_order}</td>
      <td class="num" data-l="Unit cost">${money(r.unit_cost)}</td>
      <td>${safeUrl(r.buy_link) ? `<a href="${esc(r.buy_link)}" target="_blank" rel="noopener">Link ↗</a>` : ""}</td></tr>`);
  } else if (tab === "spend") {
    const m = v => "$" + Number(v || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    const ppl = Object.entries(sp.people);
    const split = Object.values(sp.split || {}).map(v => Math.round(v * 100) + "%").join(" / ");
    const cards = ppl.map(([name, v]) => `<div class="person"><h3>${esc(name)}</h3>
      <div class="big">${m(v.month)}</div><div class="kv"><span>this month</span></div>
      <div class="kv"><span>This week</span><b>${m(v.week)}</b></div>
      <div class="kv"><span>All time</span><b>${m(v.all)}</b></div>
      <div class="kv"><span>Receipts</span><b>${v.count}</b></div></div>`).join("");
    const settle = sp.settle
      ? `<div class="settle">${esc(sp.settle.from)} owes ${esc(sp.settle.to)} ${m(sp.settle.amount)} <span style="font-weight:400">(split ${esc(split)})</span></div>`
      : (ppl.length === 2 ? `<div class="settle even">All square ✓ <span style="font-weight:400">(split ${esc(split)})</span></div>` : "");
    const rec = (sp.recent || []).filter(r => !q || (r.store || "").toLowerCase().includes(q) || (r.buyer || "").toLowerCase().includes(q));
    const recRows = rec.map(r => `<tr><td data-l="Date">${shortDate(r.date)}</td><td>${esc(r.store || "—")}</td>
      <td data-l="By">${esc(r.buyer)}</td><td class="num" data-l="Total">${m(r.total)}</td></tr>`).join("");
    $("#view").innerHTML = `<div class="spend"><div class="people">${cards || '<div class="empty">No receipts yet.</div>'}</div>${settle}
      <h4>Recent receipts</h4>${recRows ? `<table><thead><tr><th>Date</th><th>Store</th><th>By</th><th class="num">Total</th></tr></thead><tbody>${recRows}</tbody></table>` : '<div class="empty">No receipts yet.</div>'}
      <div class="sku" style="margin-top:10px">Total all time ${m(sp.total)}</div></div>`;
    return;
  } else {
    head = `<th>Ship by</th><th>Product</th><th class="num">Qty</th><th>Order</th><th>Ordered</th>`;
    rows = [...orders].sort((a, b) => (a.ship_by || "9999").localeCompare(b.ship_by || "9999")).filter(match).map(r => `<tr>
      <td data-l="Ship by">${shipChip(r.ship_by)}</td>
      <td>${prod(r)}</td>
      <td class="num" data-l="Qty">${r.qty}</td>
      <td class="sku" data-l="Order">${esc(r.order_id)}</td>
      <td data-l="Ordered">${shortDate(r.order_date)}</td></tr>`);
  }
  const emptyMsg = {need: "No open orders — nothing to buy.", inventory: "No products yet.", orders: "No open orders."}[tab];
  $("#view").innerHTML = rows.length
    ? `<table><thead><tr>${head}</tr></thead><tbody>${rows.join("")}</tbody></table>`
    : `<div class="empty">${q ? "No matches." : emptyMsg}</div>`;
}

$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.t; try { localStorage.setItem("tab", tab); } catch {}
  render();
});
$("#q").addEventListener("input", () => data && render());
$("#copy").addEventListener("click", async () => {
  if (!data) return;
  const txt = data.need.filter(r => r.to_buy > 0).map(r => `${r.to_buy}x ${r.product} (${r.sku})${shipInfo(r.ship_by) ? " - ship by " + shipInfo(r.ship_by).text : ""}${r.buy_link ? " " + r.buy_link : ""}`).join("\n") || "Nothing to buy";
  try { await navigator.clipboard.writeText(txt); $("#copy").textContent = "Copied ✓"; }
  catch { $("#copy").textContent = "Copy failed"; }
  setTimeout(() => $("#copy").textContent = "Copy buy list", 1500);
});
load();
setInterval(load, 30000);
</script>
</body>
</html>
